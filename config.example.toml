[syntax]
prefer = "auto"

# 省略 [sources] enabled 时全部来源启用；dick source enable/disable 会就地更新这一行。
# apk 是 Alpine 的原生索引；guix / nixpkgs 没有可下载的索引，只在用到时现问本机命令。
[sources]
enabled = ["pacman", "aur", "apt", "dnf", "apk", "flatpak", "linyaps", "guix", "nixpkgs", "snap"]

# snap 固定垫底：这里怎么写都会被挪到最后一名，漏写也会自动补上（它是兜底来源）。
# 注意：手动写了 order 的家族，只会按这里列出的顺序降级——新来源（apk/guix/nixpkgs）
# 要自己加进来，否则不会被尝试。
[priority.arch]
order = ["pacman", "aur", "flatpak", "linyaps", "guix", "nixpkgs", "snap"]

[priority.debian]
order = ["apt", "flatpak", "linyaps", "guix", "nixpkgs", "snap"]

[priority.fedora]
order = ["dnf", "flatpak", "linyaps", "guix", "nixpkgs", "snap"]

[priority.alpine]
order = ["apk", "flatpak", "linyaps", "guix", "nixpkgs", "snap"]

# 自动来源排序（默认 true）：安装时若 flatpak 排在原生源（pacman/apt/dnf/apk）前面，
# 而目标又是 IDE / 开发类应用（AppStream 分类含 IDE 或 Development），就把它自动降到
# 原生源之后再试——flatpak 沙箱访问不到系统级工具链。改成 false 就完全按上面的 order
# 来，可用 `dick source ranking`（方向键界面）手工排序。
# `dick source autorank enable|disable` 会写回这一行。
[install]
autorank = true

[cache]
ttl = 900

# 按需查询来源（aur / snap / linyaps / guix / nixpkgs）的缓存有效期，单位秒；
# 这里没写的来源用上面的 ttl。guix 与 nixpkgs 每查一次都要现跑一次慢速原生命令，
# 所以默认给一天，想更实时可以调小（0 表示不缓存）。
[cache.query_ttl]
guix = 86400
nixpkgs = 86400

[network]
timeout = 20
max_bytes = 67108864
workers = 4


